services:
  gateway:
    build: .
    image: devin-ai-gateway:local
    container_name: devin-ai-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8787
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
